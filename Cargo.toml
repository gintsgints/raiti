[package]
name = "raiti"
version = "0.2.0"
edition = "2021"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced.git", features = [
    "tokio",
    "lazy",
    "canvas",
    "image",
] }
smol_str = "0.3.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.21"
dirs-next = "2.0.0"
tokio = { version = "1.53.1", features = ["io-util", "fs"] }
handlebars = "6.4.4"
serde_json = "1.0.151"
rodio = { version = "0.22.2" }
rust-embed = { version = "8.12.0", features = ["include-exclude"] }

[profile.dev.package.objc2]
debug-assertions = false

[dev-dependencies]
tempfile = "3.27.0"
